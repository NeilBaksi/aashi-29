  <body>
    <!--
      DIRECTION CONTRACT — seed: alpine-apres-birthday-01
      THESIS: Rebuild of a friend's Canva birthday site. Editorial "alpine après-ski"
        mood, not a party-flyer: warm film photography, hand-painted gouache mountain
        vignettes, paper grain, plum ink on cream. One scrolling page, real header nav.
      PALETTE: paper #fcf8f1, paper-card #f5ecdd, ink #441828, accent apricot #f4b494,
        secondary lilac #d9a6ec (sparing), pine #2f4a3a for after-dark sections.
      TYPE: Petrona (warm editorial serif, wght 400-800 + italic) for headings/numerals,
        Nunito (soft rounded humanist sans) for body/UI, Barracuda Script — a
        self-hosted TTF, single loud accent face, hero title only — for the one moment
        the site is allowed to shout like a party invite before settling back into the
        editorial voice.
      STORY: Countdown → the house & address → the itinerary (Fri/Sat/Sun) → what to
        pack → the food → house rules & the people → thank you + memories upload.
      ANTI-SLOP: no gradient blobs, no glassmorphism grid, no generic sparkle icons,
        no centered-everything hero. Asymmetric editorial layout, real photography,
        content-first.
      FINISH: unreviewed and undocumented is unfinished; ends with docs/DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
